# KAYL (كَيْل) — single source of truth for models, prices, and floors.
# Code reads everything from here; nothing is hard-coded.

provider: groq

# Prices are USD per 1M tokens, taken from each model's page in the Groq
# console docs (source URL is noted next to each model below).
prices_checked_on: "2026-10-30"

models:
  # Replaced llama-3.1-8b-instant, which is no longer available on our Groq account (2026-10-30).
  allam-2-7b:
    litellm_id: groq/allam-2-7b
    size: small
    # PRICE UNKNOWN: not yet confirmed. Check https://console.groq.com/docs/model/allam-2-7b
    # Until a price is published, report estimated compute for this model instead of cost.
    input_price: null
    output_price: null
    price_verified: false
    active_params_b: 7.0               # ALLaM-2-7B is 7B dense: all params active per token
    context_window: 4096               # much smaller than gpt-oss (131k): router skips tasks that do not fit
    max_output_tokens: 1024            # smaller cap so prompt + output fit in 4096
    supports_reasoning_effort: false   # no effort control: router does not vary effort for this model
  openai/gpt-oss-20b:
    litellm_id: groq/openai/gpt-oss-20b
    size: medium
    # Verified 2026-10-30 at https://console.groq.com/docs/model/openai/gpt-oss-20b
    input_price: 0.075
    output_price: 0.30
    price_verified: true
    active_params_b: 3.6               # MoE; source: https://huggingface.co/blog/welcome-openai-gpt-oss
    context_window: 131072
    supports_reasoning_effort: true    # low / medium / high
  openai/gpt-oss-120b:
    litellm_id: groq/openai/gpt-oss-120b
    size: large
    # Verified 2026-10-30 at https://console.groq.com/docs/model/openai/gpt-oss-120b
    input_price: 0.15
    output_price: 0.60
    price_verified: true
    active_params_b: 5.1               # MoE; source: https://huggingface.co/blog/welcome-openai-gpt-oss
    context_window: 131072
    # high effort needs more room: at 2048 tokens, 20b-high was cut off in 19/90 calls.
    # Only 120b gets the bigger cap (it has its own daily quota; 20b's was used up).
    max_output_tokens_by_effort: {high: 8192}
    supports_reasoning_effort: true

# How gpt-oss calls are sent. Groq's daily token limit (200K/day) is per organization and was
# used up by calibration, so final-test calls go through OpenRouter, PINNED to the Groq provider
# (same models on the same hardware; no silent provider switch). ALLaM stays on Groq directly.
#   groq       -> litellm_id (e.g. groq/openai/gpt-oss-20b)   — used for the calibration sweep
#   openrouter -> openrouter_id with provider {only: [groq], allow_fallbacks: false}
# Costs are always computed with the Groq prices above, not OpenRouter's bill.
# The cache key includes the model id actually used, so the two routes never mix.
routing:
  gpt_oss: openrouter
  openrouter_ids:
    openai/gpt-oss-20b: openrouter/openai/gpt-oss-20b
    openai/gpt-oss-120b: openrouter/openai/gpt-oss-120b
  openrouter_provider: {only: [groq], allow_fallbacks: false}

# PRIMARY metric: estimated compute per successful task.
#   compute per call (FLOPs, ESTIMATE) = 2 × active_params × (input_tokens + output_tokens)
#   per successful task = total compute of ALL calls (incl. failures, escalations) / number correct
# Why primary: allam-2-7b has no published price, so dollar cost cannot compare all models.
# SECONDARY: dollar cost per successful task, reported only when every call used a
# model with a verified price (otherwise shown as n/a). Energy is NOT reported.
metrics:
  primary: compute_per_success
  secondary: cost_per_success
  compute_label: "estimated compute (FLOPs, estimate)"
  report_energy: false

# Before calling a model, check the task fits its context window:
#   estimated_prompt_tokens × safety_factor + max_output_tokens <= context_window
# The estimate uses LiteLLM's token counter (not the model's own tokenizer), so we add a margin.
context_check:
  safety_factor: 1.2

reasoning_efforts: [low, medium, high]

# Language the model reasons in. The final answer is always in Arabic.
# Thinking in Arabic was STOPPED: gpt-oss-20b reasoned in English in 32/32 calls when asked
# for Arabic (see RESULTS.md). The key is kept for models that may follow it.
think_languages: [ar, en]

# A configuration only "counts" if it meets both floors.
# Accuracy floor PER TASK TYPE = baseline A's calibration accuracy minus 3.3 points,
# i.e. one question fewer than baseline A (with n = 30, one question = 3.33 points).
# Baseline A = gpt-oss-120b at its default effort (medium), sweep config "120b-medium".
floors:
  status: set_from_baseline_A
  baseline_config: 120b-medium
  accuracy_margin_questions: 1   # = 3.3 points at n = 30
  accuracy: 0.80                 # used ONLY if baseline A has no data for a task type
  latency_p95_s: 15              # 95th-percentile seconds per task

prompts:
  # One short format example in the system prompt, ONLY for models without a separate
  # reasoning channel (allam-2-7b). gpt-oss prompts never get it.
  format_example: true

generation:
  temperature: 0
  max_output_tokens: 2048   # default cap (free-tier friendly); a model can override it

runs_per_experiment: 2

# Step 5: every fixed configuration on ALL calibration items (learning data only).
# "allam-noex" measures the format example. 20b-medium-ar (think in Arabic) was stopped:
# its 32 results are kept in results/think_lang_ar_stopped.jsonl.
sweep:
  - {name: allam,          model: allam-2-7b,          effort: null,   think_lang: en, format_example: true}
  - {name: allam-noex,     model: allam-2-7b,          effort: null,   think_lang: en, format_example: false}
  - {name: 20b-low,        model: openai/gpt-oss-20b,  effort: low,    think_lang: en}
  - {name: 20b-medium,     model: openai/gpt-oss-20b,  effort: medium, think_lang: en}
  - {name: 20b-high,       model: openai/gpt-oss-20b,  effort: high,   think_lang: en,
     note: "TRUNCATED: max 2048 output tokens; 19/90 replies cut off before FINAL"}
  - {name: 120b-low,       model: openai/gpt-oss-120b, effort: low,    think_lang: en}
  - {name: 120b-medium,    model: openai/gpt-oss-120b, effort: medium, think_lang: en}
  - {name: 120b-high,      model: openai/gpt-oss-120b, effort: high,   think_lang: en,
     note: "max 8192 output tokens"}

# Retries with backoff on rate limits and temporary errors (free tier).
# Wait = what Groq says ("try again in Xs"), else base_wait_s × 2^attempt, capped at max_wait_s.
retries:
  max_attempts: 6
  base_wait_s: 2
  max_wait_s: 60

# The KAYL agent (kayl/agent.py): on a failed verification, first raise effort,
# then move to the bigger model; at most this many escalations per task.
agent:
  max_escalations: 2
  min_calibration_n: 20   # ignore a configuration measured on fewer items (e.g. an interrupted sweep)

# SIMULATED outage, for robustness tests only: models listed here are treated as unavailable
# (the client refuses to call them, even from cache). Normal runs keep this list EMPTY.
# run_simulated_outage.py sets it in memory to [openai/gpt-oss-20b]; this file is not changed.
simulated_outage:
  unavailable_models: []

# Used if a call errors after retries, and by the agent when a task type has no calibration data.
fallback_model: openai/gpt-oss-20b

paths:
  data: data
  cache: cache
  db: runs/kayl.sqlite
